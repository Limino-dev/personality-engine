`]}];
const stage=document.getElementById('stage'),progress=document.getElementById('progress'),counter=document.getElementById('counter');
const nodes=SLIDES.map((sl,i)=>{
  const d=document.createElement('div');d.className='slide';d.dataset.idx=i;
  if(sl.nostep){
    d.innerHTML=sl.open+sl.groups[0]+'</svg>';
  }else{
    let inner=sl.open;
    sl.groups.forEach(g=>{
      if(g.s===0){ inner+='<g>'+g.h+'</g>'; }       // step0随页出现
      else { inner+='<g class="step" data-step="'+g.s+'">'+g.h+'</g>'; }
    });
    inner+='</svg>';
    d.innerHTML=inner;
  }
  stage.appendChild(d);return d;
});
let cur=0, step=0, maxStep=0;
function stepsOf(i){
  if(SLIDES[i].nostep) return 0;
  return Math.max(0,...SLIDES[i].groups.map(g=>g.s));
}
function render(){
  nodes.forEach((n,k)=>n.classList.toggle('active',k===cur));
  const node=nodes[cur];
  node.querySelectorAll('.step').forEach(el=>{
    const s=+el.dataset.step;
    el.classList.toggle('on', s<=step);
  });
  progress.style.width=((cur+1)/SLIDES.length*100)+'%';
  counter.textContent=(cur+1)+' / '+SLIDES.length;
}
function show(i,atStart=true){
  i=Math.max(0,Math.min(SLIDES.length-1,i));
  cur=i; maxStep=stepsOf(i);
  step=atStart?0:maxStep;
  render();
}
function next(){
  if(step<maxStep){ step++; render(); }
  else if(cur<SLIDES.length-1){ show(cur+1,true); }
}
function prev(){
  if(step>0){ step--; render(); }
  else if(cur>0){ show(cur-1,false); }   // 回上一页且显示其全部step
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  else if(e.key==='Home'){show(0,true);}
  else if(e.key==='End'){show(SLIDES.length-1,false);}
});
stage.addEventListener('click',e=>{const x=e.clientX,w=window.innerWidth;if(x<w*0.25)prev();else next();});
let tx=0;
document.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){dx<0?next():prev();}},{passive:true});
show(0,true);
</script></body></html>
